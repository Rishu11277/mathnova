<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="Math Nova — a Grade 1 math practice game covering every Common Core Grade 1 standard, with arcade breaks.">
<meta name="theme-color" content="#100d24">
<title>Math Nova · Grade 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#100d24; --bg2:#3a2470; --ink:#f5f2ff; --dim:#b3a9dd;
  --accent:#ffb020; --accent2:#ff5d73; --good:#45e0a0; --bad:#ff5d73;
  --card:rgba(255,255,255,.055); --card2:rgba(255,255,255,.09); --edge:rgba(255,255,255,.13);
  --ui:'Baloo 2',system-ui,-apple-system,sans-serif;
  --num:'Space Grotesk',ui-monospace,monospace;
  --shadow:0 26px 60px -20px rgba(0,0,0,.75);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--ink);font-family:var(--ui);
  overflow:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  -webkit-font-smoothing:antialiased;transition:background-color .7s ease;
}
button,select,input{font-family:inherit;color:inherit;font-size:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
svg{display:block}
[hidden]{display:none !important}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:8px}

#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#board{position:fixed;inset:0;width:100%;height:100%;z-index:20;pointer-events:none;touch-action:none}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:45;pointer-events:none}

.app{position:relative;z-index:10;height:100%;max-width:1040px;margin:0 auto;
  padding:calc(10px + env(safe-area-inset-top)) 14px calc(10px + env(safe-area-inset-bottom))}
.screen{display:none;height:100%;flex-direction:column;gap:clamp(8px,1.6vh,18px);min-height:0}
.screen.on{display:flex}
.scroll{flex:1;min-height:0;overflow:auto;padding:2px 4px 14px;-webkit-overflow-scrolling:touch}

/* ---------- primitives ---------- */
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grow{flex:1}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 26px;border-radius:18px;cursor:pointer;font-weight:800;font-size:1.05rem;border:none;
  background:linear-gradient(180deg,var(--accent),#e89406);color:#2a1a00;
  box-shadow:0 14px 30px -12px var(--accent);transition:transform .12s ease,filter .2s ease
}
.btn:hover{filter:brightness(1.07);transform:translateY(-2px)}
.btn:active{transform:translateY(1px)}
.btn.big{padding:18px 44px;font-size:1.35rem;border-radius:24px}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--edge);box-shadow:none;font-weight:700}
.btn.ghost:hover{border-color:var(--accent)}
.btn.danger{background:rgba(255,93,115,.16);color:var(--accent2);border:1px solid rgba(255,93,115,.4);box-shadow:none}
.btn:disabled{opacity:.45;cursor:default;transform:none;filter:none}
.icon{width:42px;height:42px;padding:0;border-radius:14px;background:var(--card);border:1px solid var(--edge);
  cursor:pointer;font-size:1.1rem;display:grid;place-items:center;flex:none}
.icon:hover{border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--edge);border-radius:24px;padding:16px 18px}
.chip{display:inline-flex;align-items:baseline;gap:7px;padding:6px 14px;border-radius:14px;
  background:var(--card);border:1px solid var(--edge);font-size:.82rem;color:var(--dim)}
.chip b{font-family:var(--num);font-weight:700;font-size:1.05rem;color:var(--ink);font-variant-numeric:tabular-nums}
.chip.mango b{color:var(--accent)}
.chip.fire b{color:var(--accent2)}
h1,h2,h3{margin:0;font-weight:800;line-height:1.1}
h2{font-size:clamp(1.3rem,3.6vmin,1.8rem)}
h3{font-size:1.05rem}
.muted{color:var(--dim)}
.small{font-size:.85rem}
.tag{font-family:var(--num);font-size:.7rem;padding:2px 7px;border-radius:7px;background:rgba(255,255,255,.08);color:var(--dim)}

/* segmented control */
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:14px;background:rgba(0,0,0,.28);border:1px solid var(--edge);flex-wrap:wrap}
.seg button{padding:7px 14px;border-radius:10px;border:none;background:transparent;color:var(--dim);cursor:pointer;font-weight:700;font-size:.9rem}
.seg button.on{background:var(--accent);color:#2a1a00}
.seg.swatches button{width:30px;height:30px;padding:0;border-radius:9px;border:2px solid transparent}
.seg.swatches button.on{border-color:#fff;background:none}

/* checkbox row */
.check{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:14px;cursor:pointer;transition:background .15s}
.check:hover{background:rgba(255,255,255,.04)}
.check input{position:absolute;opacity:0;width:0;height:0}
.box{width:26px;height:26px;border-radius:9px;border:2px solid var(--dim);display:grid;place-items:center;flex:none;transition:all .18s cubic-bezier(.34,1.56,.64,1)}
.box svg{width:16px;height:16px;opacity:0;transform:scale(.5);transition:all .18s}
.check input:checked + .box{background:var(--good);border-color:var(--good)}
.check input:checked + .box svg{opacity:1;transform:scale(1)}
.check input:focus-visible + .box{outline:3px solid var(--accent);outline-offset:2px}
.check .lbl{flex:1;min-width:0}
.check .lbl b{display:block;font-weight:700}
.check .lbl span{display:block;font-size:.8rem;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- home ---------- */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:clamp(6px,3vh,30px) 0 6px}
.hero .logo{width:clamp(86px,16vmin,130px);height:auto}
.hero h1{font-size:clamp(2rem,7vmin,3.4rem);letter-spacing:-.5px}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{margin:0;color:var(--dim);font-size:clamp(.95rem,2.4vmin,1.15rem)}
.players{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.player{display:flex;align-items:center;gap:9px;padding:8px 16px 8px 10px;border-radius:18px;cursor:pointer;
  background:var(--card);border:2px solid var(--edge);font-weight:700;transition:all .15s}
.player .av{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center;font-size:1.2rem}
.player.on{border-color:var(--accent);background:rgba(255,176,32,.12)}
.player.add{color:var(--dim);border-style:dashed}
.home-actions{display:flex;flex-direction:column;align-items:center;gap:12px;padding-bottom:8px}
.home-actions .row{justify-content:center}
.stats-strip{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* ---------- skills ---------- */
.presets{display:flex;gap:8px;flex-wrap:wrap}
.presets button{padding:8px 14px;border-radius:14px;background:var(--card);border:1px solid var(--edge);color:var(--ink);cursor:pointer;font-weight:700;font-size:.9rem}
.presets button:hover{border-color:var(--accent)}
.domains{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.domain{padding:12px 12px 6px}
.domain header{display:flex;align-items:center;gap:10px;padding:4px 8px 10px}
.domain header .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:1.3rem;background:rgba(255,255,255,.08)}
.domain header .lk{color:var(--dim);font-size:.85rem;cursor:pointer;border:none;background:none;padding:4px 8px;border-radius:8px}
.domain header .lk:hover{color:var(--ink);background:rgba(255,255,255,.06)}
.cluster{font-size:.74rem;color:var(--dim);text-transform:none;letter-spacing:.2px;padding:8px 8px 2px;opacity:.85}

/* ---------- settings ---------- */
.setting{display:flex;align-items:center;gap:14px;padding:12px 6px;border-bottom:1px solid var(--edge);flex-wrap:wrap}
.setting:last-child{border-bottom:none}
.setting .lbl{flex:1;min-width:180px}
.setting .lbl b{display:block}
.setting .lbl span{font-size:.82rem;color:var(--dim)}

/* ---------- play ---------- */
.playhead{display:flex;align-items:center;gap:10px}
.prog{flex:1;height:10px;border-radius:10px;background:rgba(255,255,255,.12);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .35s ease}
.stage{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,1.8vh,20px)}
.pips{display:flex;gap:8px;align-items:center}
.pips i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.16);transition:all .35s cubic-bezier(.34,1.56,.64,1)}
.pips i.on{background:var(--accent);box-shadow:0 0 14px var(--accent);transform:scale(1.25)}
.pips span{font-size:.78rem;color:var(--dim);margin-left:5px}

.qcard{
  width:100%;max-width:760px;display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.6vh,16px);
  padding:clamp(14px,2.6vh,26px) clamp(16px,3vw,34px);border-radius:32px;background:var(--card);border:1px solid var(--edge);
  box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.07);max-height:100%;overflow:auto
}
.skill{display:flex;align-items:center;gap:8px;align-self:flex-start;font-size:.8rem;color:var(--dim)}
.skill .speak{width:34px;height:34px;border-radius:11px;font-size:1rem}
.prompt{font-size:clamp(1.05rem,2.9vmin,1.4rem);font-weight:600;text-align:center;line-height:1.35;max-width:640px}
.prompt.story{text-align:left;font-weight:600;font-size:clamp(1.05rem,3vmin,1.35rem);line-height:1.5}
.eq{
  display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:clamp(8px,1.8vw,18px);
  font-family:var(--num);font-weight:700;font-size:clamp(1.9rem,7.2vmin,3.8rem);line-height:1;font-variant-numeric:tabular-nums
}
.eq .op{color:var(--accent2);font-weight:500}
.eq .eqs{color:var(--dim);font-weight:500}
.eq .sub{width:100%;text-align:center;font-family:var(--ui);font-weight:600;font-size:clamp(.9rem,2.4vmin,1.1rem);color:var(--dim);margin-top:4px}
.slot{
  display:inline-grid;place-items:center;
  width:clamp(52px,11vmin,96px);height:clamp(52px,11vmin,96px);
  border-radius:20px;border:3px dashed var(--accent);color:var(--accent);
  background:rgba(0,0,0,.28);transition:all .4s cubic-bezier(.34,1.56,.64,1)
}
.slot.wait{animation:breathe 2.6s ease-in-out infinite}
.slot.done{border-style:solid;border-color:var(--good);color:var(--good);background:rgba(69,224,160,.12);box-shadow:0 0 34px -6px var(--good)}
@keyframes breathe{50%{border-color:var(--accent2);transform:scale(1.04)}}
.stim{width:100%;display:flex;justify-content:center}
.stim svg{max-width:100%;height:auto;max-height:min(30vh,260px)}
.stim.emoji{flex-wrap:wrap;gap:6px 4px;font-size:clamp(1.3rem,4vmin,2rem);line-height:1.1;max-width:560px}
.stim.emoji .grp{display:flex;flex-wrap:wrap;gap:4px;padding:8px 10px;border-radius:16px;background:rgba(255,255,255,.05);border:1px solid var(--edge);max-width:100%}
.stim.emoji .grp span.x{opacity:.32;filter:grayscale(1);position:relative}
.stim.emoji .grp span.x::after{content:'';position:absolute;left:10%;right:10%;top:50%;height:3px;background:var(--accent2);transform:rotate(-20deg);border-radius:2px}
.stim.emoji .plus{align-self:center;color:var(--accent2);font-family:var(--num);font-weight:700;font-size:1.6rem;padding:0 4px}

.pad{display:grid;gap:clamp(8px,1.6vh,14px);width:100%;max-width:560px}
.pad[data-n="2"]{grid-template-columns:repeat(2,1fr)}
.pad[data-n="3"]{grid-template-columns:repeat(3,1fr)}
.pad[data-n="4"]{grid-template-columns:repeat(2,1fr)}
.pad.vis[data-n="4"]{grid-template-columns:repeat(4,1fr)}
.opt{
  min-height:clamp(54px,9.5vh,88px);border-radius:22px;cursor:pointer;padding:8px 10px;
  background:var(--card);border:1px solid var(--edge);display:grid;place-items:center;
  font-family:var(--num);font-weight:700;font-size:clamp(1.35rem,4.6vmin,2.3rem);font-variant-numeric:tabular-nums;
  box-shadow:0 12px 26px -14px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.06);
  transition:transform .12s ease,border-color .2s ease,background .2s ease
}
.opt.txt{font-family:var(--ui);font-weight:700;font-size:clamp(1rem,2.8vmin,1.25rem);line-height:1.25;text-align:center}
.opt.sym{font-size:clamp(1.8rem,6vmin,3rem)}
.opt.vis{padding:10px}
.opt.vis svg{width:100%;height:auto;max-height:min(16vh,120px)}
.opt:hover:not(:disabled){border-color:var(--accent);transform:translateY(-3px)}
.opt:active:not(:disabled){transform:translateY(1px)}
.opt:disabled{cursor:default;opacity:.45}
.opt.hit{background:rgba(69,224,160,.2);border-color:var(--good);color:var(--good);opacity:1}
.opt.miss{background:rgba(255,93,115,.2);border-color:var(--accent2);color:var(--accent2);opacity:1}
.opt.reveal{border-color:var(--good);opacity:1;box-shadow:0 0 0 3px rgba(69,224,160,.45)}
.hint{font-size:.9rem;color:var(--dim);min-height:1.3em;text-align:center;margin:0}
.hint.good{color:var(--good)}
.hint.bad{color:var(--accent2)}
.hintbox{width:100%;max-width:640px;display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:16px;
  background:rgba(255,176,32,.1);border:1px solid rgba(255,176,32,.35);font-size:.95rem;line-height:1.4}
.hintbox i{font-style:normal;flex:none}
.solution{width:100%;max-width:640px;border-radius:20px;background:rgba(69,224,160,.07);border:1px solid rgba(69,224,160,.3);padding:12px 16px 8px}
.solution h4{margin:0 0 6px;font-size:.95rem;color:var(--good);display:flex;align-items:center;gap:8px}
.solution ol{margin:0;padding-left:0;list-style:none;counter-reset:st}
.solution li{counter-increment:st;display:flex;gap:12px;padding:7px 0;border-top:1px solid rgba(255,255,255,.07);font-size:.98rem;line-height:1.4}
.solution li::before{content:counter(st);flex:none;width:24px;height:24px;border-radius:50%;background:var(--good);color:#0b2a1e;font-weight:800;font-size:.8rem;display:grid;place-items:center;margin-top:1px}
.solution li:first-child{border-top:none}
.soltoggle{background:none;border:1px solid var(--edge);color:var(--dim);padding:6px 14px;border-radius:12px;cursor:pointer;font-weight:700;font-size:.85rem}
.soltoggle:hover{color:var(--ink);border-color:var(--good)}
.tries{display:flex;gap:6px;margin-left:auto}
.tries i{width:10px;height:10px;border-radius:50%;background:var(--accent);opacity:.9}
.tries i.used{background:rgba(255,255,255,.18)}

.tools{position:relative;z-index:30;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.tool{padding:8px 16px;border-radius:14px;cursor:pointer;font-weight:600;font-size:.88rem;background:var(--card);border:1px solid var(--edge);color:var(--dim);transition:all .2s}
.tool:hover{color:var(--ink)}
.tool.on{background:var(--accent);border-color:var(--accent);color:#2a1a00;font-weight:800}
.tool.wipe{color:var(--accent2);border-color:rgba(255,93,115,.35)}

/* ---------- summary / report ---------- */
.ring{width:150px;height:150px;position:relative;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring b{font-family:var(--num);font-size:2.2rem}
.ring small{display:block;font-family:var(--ui);font-size:.8rem;color:var(--dim);text-align:center}
.skillrow{display:flex;align-items:center;gap:12px;padding:9px 4px;border-bottom:1px solid var(--edge)}
.skillrow:last-child{border-bottom:none}
.skillrow .name{flex:1;min-width:0}
.skillrow .name b{display:block;font-weight:700}
.skillrow .name span{font-size:.78rem;color:var(--dim)}
.meter{width:140px;height:9px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden;flex:none}
.meter i{display:block;height:100%;background:var(--good)}
.meter i.mid{background:var(--accent)}
.meter i.low{background:var(--accent2)}
.pct{font-family:var(--num);width:56px;text-align:right;font-variant-numeric:tabular-nums;flex:none}
.badges{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.badge{display:flex;flex-direction:column;align-items:center;gap:4px;width:88px;padding:10px 6px;border-radius:18px;background:var(--card);border:1px solid var(--edge);font-size:.72rem;color:var(--dim);text-align:center}
.badge i{font-style:normal;font-size:1.7rem}
.badge.on{border-color:var(--accent);color:var(--ink);background:rgba(255,176,32,.1)}
.badge:not(.on) i{filter:grayscale(1);opacity:.45}

/* ---------- modals ---------- */
.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:14px;
  background:rgba(7,5,18,.88);backdrop-filter:blur(16px);opacity:0;pointer-events:none;transition:opacity .3s ease}
.modal.on{opacity:1;pointer-events:auto}
.sheet{width:min(780px,96vw);max-height:96vh;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:clamp(14px,2.4vh,22px);
  border-radius:32px;border:1px solid var(--edge);background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.025));box-shadow:0 40px 90px -30px #000}
.sheet.narrow{width:min(460px,96vw)}
.clock{font-family:var(--num);font-weight:700;font-size:1.15rem;color:var(--accent);margin-left:auto;font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:7px;background:rgba(255,255,255,.13);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));transform-origin:left;transition:transform .3s linear}
.say{font-size:.92rem;line-height:1.45;color:var(--dim);margin:0}
.mgwrap{position:relative;width:100%;height:min(52vh,64vw);min-height:230px;border-radius:24px;overflow:hidden;background:#06051a;border:1px solid var(--edge)}
#mg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.gamegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.quests{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.quest{display:flex;flex-direction:column;gap:5px;padding:9px 12px;border-radius:14px;background:var(--card);border:1px solid var(--edge);font-size:.82rem}
.quest .qt{display:flex;justify-content:space-between;gap:8px;align-items:center}
.quest .qt b{font-weight:700}
.quest .qt span{color:var(--accent);font-family:var(--num);font-size:.78rem;white-space:nowrap}
.quest .qb{height:6px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden}
.quest .qb i{display:block;height:100%;background:var(--accent);transition:width .4s ease}
.quest.done{border-color:var(--good);background:rgba(69,224,160,.08)}
.quest.done .qb i{background:var(--good)}
.quest.done .qt span{color:var(--good)}
.hangar{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.skin{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:var(--card);border:1px solid var(--edge)}
.skin.on{border-color:var(--accent)}
.skin .sw{width:34px;height:34px;border-radius:12px;flex:none;position:relative}
.skin .sw::after{content:'';position:absolute;right:-4px;bottom:-4px;width:16px;height:16px;border-radius:50%;border:2px solid var(--bg);background:var(--trim)}
.skin .nm{flex:1;min-width:0}
.skin .nm b{display:block}
.skin .nm span{font-size:.78rem;color:var(--dim)}
.skin button{padding:7px 12px;border-radius:12px;font-weight:700;font-size:.82rem;cursor:pointer;border:1px solid var(--edge);background:var(--card2);color:var(--ink)}
.skin button.buy{background:var(--accent);color:#2a1a00;border-color:var(--accent)}
.skin button:disabled{opacity:.45;cursor:default}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:80;
  padding:12px 20px;border-radius:18px;background:rgba(20,14,40,.92);border:1px solid var(--accent);color:var(--ink);font-weight:700;
  box-shadow:0 20px 50px -20px #000;opacity:0;pointer-events:none;transition:all .35s cubic-bezier(.34,1.56,.64,1);max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.tabs{display:flex;gap:6px}
.tabs button{padding:8px 16px;border-radius:12px;border:1px solid var(--edge);background:var(--card);color:var(--dim);font-weight:700;cursor:pointer}

<script>
/* ============================================================
   GENERATORS — pure functions, no DOM. Every Grade 1 CCSS standard.
   A problem: { prompt, story, eq, stim, stimEmoji, options[], answer, read, vis, fixed }
   option: { t (text) | h (html), v (value), cls }
   ============================================================ */
/* GEN-START */
const ri = (a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick = a=>a[Math.floor(Math.random()*a.length)];
const chance = p=>Math.random()<p;
const shuffle = a=>{ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const pad2 = n=>String(n).padStart(2,'0');
const countStr = (from,k,dir)=>{ const a=[]; for(let i=1;i<=k;i++) a.push(from+dir*i); return a.join(', '); };
const tens = n=>Math.floor(n/10), ones = n=>n%10;
const S = (...steps)=>steps.filter(Boolean);

function finalize(opts, correctV, fixed){
  if(!fixed) shuffle(opts);
  return { options:opts, answer:opts.findIndex(o=>o.v===correctV), fixed:!!fixed };
}
/* numeric options near the answer */
function numOpts(ans, o={}){
  const {min=0, max=Infinity, count=4, spread=4, prefer=[]} = o;
  const set = new Set([ans]);
  for(const p of prefer) if(set.size<count && p!==ans && p>=min && p<=max && Number.isInteger(p)) set.add(p);
  let tries = 0;
  while(set.size<count && tries<300){ tries++; const d = ans+ri(-spread,spread); if(d!==ans && d>=min && d<=max) set.add(d); }
  let k = 1;
  while(set.size<count && k<2000){ for(const d of [ans-k,ans+k]) if(set.size<count && d>=min && d<=max && d!==ans) set.add(d); k++; }
  return finalize([...set].map(v=>({t:String(v),v})), ans);
}
function textOpts(correct, distractors, cls='txt', fixed){
  const seen = new Set([correct]); const opts = [{t:correct,v:correct,cls}];
  for(const d of distractors){ if(opts.length>=4) break; if(!seen.has(d)){ seen.add(d); opts.push({t:d,v:d,cls}); } }
  return finalize(opts, correct, fixed);
}
function htmlOpts(correct, distractors, cls='vis'){
  const opts = [{h:correct.h,v:'ok',cls}];
  distractors.slice(0,3).forEach((d,i)=>opts.push({h:d.h,v:'d'+i,cls}));
  return finalize(opts,'ok');
}

/* ---------- equation rendering ---------- */
const OPS = new Set(['+','−','=','<','>',',']);
function eqHtml(tokens, sub){
  let h = '';
  for(const t of tokens){
    if(t === '?') h += '<span class="slot wait" id="slot">?</span>';
    else if(t === '=' || t === ',') h += '<span class="eqs">'+t+'</span>';
    else if(typeof t === 'string' && OPS.has(t)) h += '<span class="op">'+t+'</span>';
    else if(typeof t === 'object' && t.w) h += '<span class="sub" style="width:auto;margin:0;font-size:.55em;align-self:center">'+t.w+'</span>';
    else h += '<span class="n">'+t+'</span>';
  }
  if(sub) h += '<div class="sub">'+sub+'</div>';
  return h;
}
function readEq(tokens){
  return tokens.map(t=>{
    if(t === '?') return 'what number';
    if(t === '+') return 'plus'; if(t === '−') return 'minus'; if(t === '=') return 'equals';
    if(t === '<') return 'is less than'; if(t === '>') return 'is greater than'; if(t === ',') return ',';
    if(typeof t === 'object') return t.w;
    return String(t);
  }).join(' ');
}

/* ---------- SVG builders ---------- */
const SVG = (w,h,inner,extra='')=>'<svg viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'" role="img" '+extra+'>'+inner+'</svg>';
const HUES = ['#ffb020','#ff5d73','#45e0a0','#5dc8ff','#c98bff','#ff9b5d'];

function svgNumberLine(lo,hi,mark){
  const W = 620, H = 74, x0 = 26, x1 = W-26, step = (x1-x0)/(hi-lo);
  let s = '<line x1="'+(x0-14)+'" y1="34" x2="'+(x1+14)+'" y2="34" stroke="var(--dim)" stroke-width="3" stroke-linecap="round"/>';
  for(let n=lo;n<=hi;n++){
    const x = x0+(n-lo)*step;
    s += '<line x1="'+x+'" y1="26" x2="'+x+'" y2="42" stroke="var(--dim)" stroke-width="2.5"/>';
    s += '<text x="'+x+'" y="64" fill="var(--ink)" font-size="15" text-anchor="middle" font-family="Space Grotesk,monospace" font-weight="700">'+n+'</text>';
    if(n === mark) s += '<circle cx="'+x+'" cy="34" r="9" fill="var(--accent)"/>';
  }
  return SVG(W,H,s);
}
function svgTenFrames(n){
  const c = 20, frames = Math.max(1,Math.ceil(n/10)), cols = Math.min(frames,4), rows = Math.ceil(frames/cols), g = 14;
  const W = cols*5*c+(cols-1)*g+4, H = rows*2*c+(rows-1)*g+4;
  let s = '';
  for(let f=0;f<frames;f++){
    const ox = 2+(f%cols)*(5*c+g), oy = 2+Math.floor(f/cols)*(2*c+g);
    s += '<rect x="'+ox+'" y="'+oy+'" width="'+(5*c)+'" height="'+(2*c)+'" rx="6" fill="rgba(255,255,255,.04)" stroke="var(--edge)" stroke-width="1.5"/>';
    for(let i=1;i<5;i++) s += '<line x1="'+(ox+i*c)+'" y1="'+oy+'" x2="'+(ox+i*c)+'" y2="'+(oy+2*c)+'" stroke="var(--edge)"/>';
    s += '<line x1="'+ox+'" y1="'+(oy+c)+'" x2="'+(ox+5*c)+'" y2="'+(oy+c)+'" stroke="var(--edge)"/>';
    const inFrame = Math.min(10, n-f*10);
    for(let d=0; d<inFrame; d++){
      const cx = ox+(d%5)*c+c/2, cy = oy+Math.floor(d/5)*c+c/2;
      s += '<circle cx="'+cx+'" cy="'+cy+'" r="7" fill="'+(f%2?'var(--accent2)':'var(--accent)')+'"/>';
    }
  }
  return SVG(W,H,s);
}
function svgBaseTen(groups){
  // groups: [{t,o}] — draws rods and units, '+' between groups
  const rodW = 16, rodH = 110, gap = 8, unit = 16;
  let x = 6, s = '', H = rodH+12;
  groups.forEach((gr,gi)=>{
    if(gi){ s += '<text x="'+(x+10)+'" y="'+(H/2+10)+'" fill="var(--accent2)" font-size="30" font-family="Space Grotesk,monospace" font-weight="700">+</text>'; x += 42; }
    for(let i=0;i<gr.t;i++){
      s += '<rect x="'+x+'" y="6" width="'+rodW+'" height="'+rodH+'" rx="4" fill="var(--accent)" opacity=".95"/>';
      for(let k=1;k<10;k++) s += '<line x1="'+x+'" y1="'+(6+k*rodH/10)+'" x2="'+(x+rodW)+'" y2="'+(6+k*rodH/10)+'" stroke="rgba(0,0,0,.35)" stroke-width="1.5"/>';
      x += rodW+gap;
    }
    if(gr.t) x += 8;
    for(let i=0;i<gr.o;i++){
      const col = Math.floor(i/5), row = i%5;
      s += '<rect x="'+(x+col*(unit+5))+'" y="'+(6+rodH-unit-row*(unit+5))+'" width="'+unit+'" height="'+unit+'" rx="3" fill="var(--accent2)"/>';
    }
    x += gr.o ? Math.ceil(gr.o/5)*(unit+5)+6 : 0;
  });
  return SVG(Math.max(x+6,60),H,s);
}
function svgClock(h,m,size=200){
  const r = size/2-6, cx = size/2, cy = size/2;
  let s = '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="rgba(255,255,255,.06)" stroke="var(--ink)" stroke-width="'+(size*.03)+'"/>';
  for(let i=0;i<60;i++){
    const a = i*6*Math.PI/180, big = i%5===0, r1 = r*(big?.86:.92);
    s += '<line x1="'+(cx+Math.sin(a)*r1)+'" y1="'+(cy-Math.cos(a)*r1)+'" x2="'+(cx+Math.sin(a)*r*.97)+'" y2="'+(cy-Math.cos(a)*r*.97)+'" stroke="var(--dim)" stroke-width="'+(big?size*.02:size*.008)+'"/>';
  }
  for(let i=1;i<=12;i++){
    const a = i*30*Math.PI/180, rr = r*.72;
    s += '<text x="'+(cx+Math.sin(a)*rr)+'" y="'+(cy-Math.cos(a)*rr+size*.04)+'" fill="var(--ink)" font-size="'+(size*.11)+'" text-anchor="middle" font-family="Space Grotesk,monospace" font-weight="700">'+i+'</text>';
  }
  const ha = ((h%12)+m/60)*30*Math.PI/180, ma = m*6*Math.PI/180;
  s += '<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+Math.sin(ha)*r*.48)+'" y2="'+(cy-Math.cos(ha)*r*.48)+'" stroke="var(--ink)" stroke-width="'+(size*.045)+'" stroke-linecap="round"/>';
  s += '<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+Math.sin(ma)*r*.7)+'" y2="'+(cy-Math.cos(ma)*r*.7)+'" stroke="var(--accent)" stroke-width="'+(size*.03)+'" stroke-linecap="round"/>';
  s += '<circle cx="'+cx+'" cy="'+cy+'" r="'+(size*.03)+'" fill="var(--accent2)"/>';
  return SVG(size,size,s);
}
function svgBars(cats,counts){
  const W = 440, H = 256, left = 46, bottom = 208, top = 16, maxY = Math.max(5,Math.max(...counts)) , plotH = bottom-top;
  const bw = 66, gapX = (W-left-20-cats.length*bw)/(cats.length+1);
  let s = '';
  for(let v=0;v<=maxY;v++){
    const y = bottom-v/maxY*plotH;
    s += '<line x1="'+left+'" y1="'+y+'" x2="'+(W-14)+'" y2="'+y+'" stroke="'+(v?'rgba(255,255,255,.12)':'var(--dim)')+'" stroke-width="'+(v?1:2)+'"/>';
    s += '<text x="'+(left-8)+'" y="'+(y+6)+'" fill="var(--ink)" font-size="17" text-anchor="end" font-family="Space Grotesk,monospace" font-weight="700">'+v+'</text>';
  }
  cats.forEach((c,i)=>{
    const x = left+gapX*(i+1)+bw*i, hgt = counts[i]/maxY*plotH;
    s += '<rect x="'+x+'" y="'+(bottom-hgt)+'" width="'+bw+'" height="'+hgt+'" rx="8" fill="'+HUES[i%HUES.length]+'"/>';
    s += '<text x="'+(x+bw/2)+'" y="'+(bottom+24)+'" font-size="20" text-anchor="middle">'+c.e+'</text>';
    s += '<text x="'+(x+bw/2)+'" y="'+(bottom+42)+'" fill="var(--ink)" font-size="15" text-anchor="middle" font-family="Baloo 2,sans-serif" font-weight="700">'+c.n+'</text>';
  });
  return SVG(W,H,s);
}
function htmlPictograph(cats,counts){
  let h = '<div style="display:grid;grid-template-columns:auto 1fr;gap:8px 14px;align-items:center;font-size:1rem;max-width:560px">';
  cats.forEach((c,i)=>{
    h += '<div style="font-weight:700;color:var(--ink)">'+c.n+'</div><div style="display:flex;flex-wrap:wrap;gap:3px;font-size:1.5rem;line-height:1">'+Array(counts[i]).fill('<span>'+c.e+'</span>').join('')+'</div>';
  });
  return h+'</div><div class="small muted" style="text-align:center;margin-top:6px">Each picture = 1 child</div>';
}
function svgLengths(items){
  // items [{name,color,len}], len in units 1..10
  const W = 460, rowH = 44, H = items.length*rowH+8, unit = 36;
  let s = '';
  items.forEach((it,i)=>{
    const y = 8+i*rowH;
    s += '<text x="0" y="'+(y+24)+'" fill="var(--ink)" font-size="16" font-family="Baloo 2,sans-serif" font-weight="700">'+(it.label||it.name)+'</text>';
    s += '<rect x="78" y="'+(y+6)+'" width="'+(it.len*unit)+'" height="24" rx="12" fill="'+it.color+'"/>';
  });
  return SVG(W,H,s);
}
function svgMeasure(len,name,color){
  const u = 38, W = len*u+16, H = 100;
  let s = '<rect x="8" y="10" width="'+(len*u)+'" height="30" rx="12" fill="'+color+'"/>';
  s += '<text x="'+(8+len*u/2)+'" y="31" fill="#1a1020" font-size="15" text-anchor="middle" font-family="Baloo 2,sans-serif" font-weight="800">'+name+'</text>';
  for(let i=0;i<len;i++){
    s += '<rect x="'+(8+i*u)+'" y="52" width="'+(u-4)+'" height="'+(u-4)+'" rx="5" fill="rgba(255,255,255,.08)" stroke="var(--ink)" stroke-width="2"/>';
  }
  return SVG(W,H,s);
}
/* shapes */
const SHAPES = {
  triangle:{n:3,name:'triangle'}, square:{n:4,name:'square'}, rectangle:{n:4,name:'rectangle'},
  rhombus:{n:4,name:'rhombus'}, trapezoid:{n:4,name:'trapezoid'}, pentagon:{n:5,name:'pentagon'},
  hexagon:{n:6,name:'hexagon'}, circle:{n:0,name:'circle'}
};
const SHAPE_CONFLICT = { square:['rectangle','rhombus'], rectangle:['square'], rhombus:['square'] };
function shapePts(kind, cx, cy, r){
  const reg = (n,off)=>Array.from({length:n},(_,i)=>{ const a = off+i*2*Math.PI/n; return [cx+Math.cos(a)*r, cy+Math.sin(a)*r]; });
  switch(kind){
    case 'triangle': return reg(3,-Math.PI/2);
    case 'square': return reg(4,-Math.PI/4);
    case 'rectangle': return [[cx-r,cy-r*.55],[cx+r,cy-r*.55],[cx+r,cy+r*.55],[cx-r,cy+r*.55]];
    case 'rhombus': return [[cx,cy-r],[cx+r*.6,cy],[cx,cy+r],[cx-r*.6,cy]];

function svgShape(kind, o={}){

/* partitions */
function svgPartition(shape, o={}){
  // shape: 'circle'|'rect' ; parts: 2|4 ; shade: count shaded ; equal: bool ; style variant
  const {parts=2, shade=1, equal=true, style=0, size=140, fill=pick(HUES)} = o;
  const W = shape === 'circle' ? size : size*1.35, H = size, stroke = 'var(--ink)', sw = 4;
  let s = '';
  if(shape === 'circle'){
    const cx = W/2, cy = H/2, r = size*.42;
    s += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="rgba(255,255,255,.07)" stroke="'+stroke+'" stroke-width="'+sw+'"/>';
    if(parts === 2){
      const d = equal ? 0 : r*.42, hh = Math.sqrt(r*r-d*d);
      const x = cx+d;
      let g = '';
      if(shade) g += '<path d="M'+x+' '+(cy-hh)+' A'+r+' '+r+' 0 0 1 '+x+' '+(cy+hh)+' Z" fill="'+fill+'"/>';
      if(shade === 2) g += '<path d="M'+x+' '+(cy-hh)+' A'+r+' '+r+' 0 0 0 '+x+' '+(cy+hh)+' Z" fill="'+fill+'"/>';
      g += '<line x1="'+x+'" y1="'+(cy-hh)+'" x2="'+x+'" y2="'+(cy+hh)+'" stroke="'+stroke+'" stroke-width="'+sw+'"/>';
      s += style === 1 ? '<g transform="rotate(90 '+cx+' '+cy+')">'+g+'</g>' : g;
    } else {
      const quads = [[1,0],[0,1],[-1,0],[0,-1]];
      for(let i=0;i<Math.min(shade,4);i++){
        const [ax,ay] = quads[i], [bx,by] = quads[(i+1)%4];
        s += '<path d="M'+cx+' '+cy+' L'+(cx+ax*r)+' '+(cy+ay*r)+' A'+r+' '+r+' 0 0 1 '+(cx+bx*r)+' '+(cy+by*r)+' Z" fill="'+fill+'"/>';
      }
      if(equal){
        s += '<line x1="'+(cx-r)+'" y1="'+cy+'" x2="'+(cx+r)+'" y2="'+cy+'" stroke="'+stroke+'" stroke-width="'+sw+'"/>';
        s += '<line x1="'+cx+'" y1="'+(cy-r)+'" x2="'+cx+'" y2="'+(cy+r)+'" stroke="'+stroke+'" stroke-width="'+sw+'"/>';
      } else {
        s += '<line x1="'+(cx-r)+'" y1="'+cy+'" x2="'+(cx+r)+'" y2="'+cy+'" stroke="'+stroke+'" stroke-width="'+sw+'"/>';
        s += '<line x1="'+(cx+r*.5)+'" y1="'+(cy-Math.sqrt(r*r-r*r*.25))+'" x2="'+(cx+r*.5)+'" y2="'+(cy+Math.sqrt(r*r-r*r*.25))+'" stroke="'+stroke+'" stroke-width="'+sw+'"/>';
      }
    }
  } else {
    const x = 8, y = 14, w = W-16, h = H-28;
    s += '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="rgba(255,255,255,.07)" stroke="'+stroke+'" stroke-width="'+sw+'" rx="4"/>';
    const cuts = []; const cells = [];
    if(parts === 2){
      if(style === 0){ const cx = x+w*(equal?.5:.3); cuts.push(['V',cx]); cells.push([x,y,cx-x,h],[cx,y,x+w-cx,h]); }
      else if(style === 1){ const cy = y+h*(equal?.5:.32); cuts.push(['H',cy]); cells.push([x,y,w,cy-y],[x,cy,w,y+h-cy]); }
      else { cuts.push(['D']); cells.push('tri'); }
    } else {
      if(style === 0){
        if(equal){ cuts.push(['V',x+w/2],['H',y+h/2]); cells.push([x,y,w/2,h/2],[x+w/2,y,w/2,h/2],[x,y+h/2,w/2,h/2],[x+w/2,y+h/2,w/2,h/2]); }
        else { const vx = x+w*.35, hy = y+h*.5; cuts.push(['V',vx],['H',hy]); cells.push([x,y,vx-x,hy-y],[vx,y,x+w-vx,hy-y],[x,hy,vx-x,y+h-hy],[vx,hy,x+w-vx,y+h-hy]); }
      } else {
        const fr = equal ? [.25,.5,.75] : [.15,.35,.7];
        let px = x; const xs = [x, ...fr.map(f=>x+w*f), x+w];
        for(let i=0;i<4;i++) cells.push([xs[i],y,xs[i+1]-xs[i],h]);
        fr.forEach(f=>cuts.push(['V',x+w*f]));
      }
    }
    if(cells[0] === 'tri'){
      if(shade >= 1) s += '<polygon points="'+x+','+y+' '+(x+w)+','+y+' '+(x+w)+','+(y+h)+'" fill="'+fill+'"/>';
      if(shade >= 2) s += '<polygon points="'+x+','+y+' '+x+','+(y+h)+' '+(x+w)+','+(y+h)+'" fill="'+fill+'"/>';
      s += '<line x1="'+x+'" y1="'+y+'" x2="'+(x+w)+'" y2="'+(y+h)+'" stroke="'+stroke+'" stroke-width="'+sw+'"/>';
    } else {
      for(let i=0;i<Math.min(shade,cells.length);i++){ const c = cells[i]; s += '<rect x="'+c[0]+'" y="'+c[1]+'" width="'+c[2]+'" height="'+c[3]+'" fill="'+fill+'"/>'; }
      for(const c of cuts){
        if(c[0] === 'V') s += '<line x1="'+c[1]+'" y1="'+y+'" x2="'+c[1]+'" y2="'+(y+h)+'" stroke="'+stroke+'" stroke-width="'+sw+'"/>';
        else s += '<line x1="'+x+'" y1="'+c[1]+'" x2="'+(x+w)+'" y2="'+c[1]+'" stroke="'+stroke+'" stroke-width="'+sw+'"/>';
      }
      s += '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" fill="none" stroke="'+stroke+'" stroke-width="'+sw+'" rx="4"/>';
    }
  }
  return SVG(W,H,s);
}

const COMPOSITES = {

function svgComposite(kind, o={}){
  const {size=150, fill=pick(HUES), seam=true} = o;
  const cx = size/2, cy = size/2, r = size*.4, st = 'stroke="var(--ink)" stroke-width="4" stroke-dasharray="7 6"';
  let body = '', seams = '';
  const poly = pts=>'<polygon points="'+pts.map(q=>q.join(',')).join(' ')+'" fill="'+fill+'"/>';
  switch(kind){
    case 'sq2tri': body = poly([[cx-r,cy-r],[cx+r,cy-r],[cx+r,cy+r],[cx-r,cy+r]]); seams = '<line x1="'+(cx-r)+'" y1="'+(cy-r)+'" x2="'+(cx+r)+'" y2="'+(cy+r)+'" '+st+'/>'; break;

    case 'hex2trap': body = poly(shapePts('hexagon',cx,cy,r)); seams = '<line x1="'+(cx-r)+'" y1="'+cy+'" x2="'+(cx+r)+'" y2="'+cy+'" '+st+'/>'; break;
    case 'tri2rt': body = poly([[cx,cy-r],[cx+r,cy+r*.7],[cx-r,cy+r*.7]]); seams = '<line x1="'+cx+'" y1="'+(cy-r)+'" x2="'+cx+'" y2="'+(cy+r*.7)+'" '+st+'/>'; break;
    case 'circ2half': body = '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+fill+'"/>'; seams = '<line x1="'+cx+'" y1="'+(cy-r)+'" x2="'+cx+'" y2="'+(cy+r)+'" '+st+'/>'; break;

function svgPieces(kind, o={}){

    case 'sq2tri': s = poly([[cx-r-g,cy-r],[cx-g-r+2*r,cy-r],[cx-r-g,cy+r]]) + poly([[cx+r+g,cy+r],[cx+g+r-2*r,cy+r],[cx+r+g,cy-r]]); break;
    case 'sq2rect': s = poly([[cx-g-r,cy-r],[cx-g,cy-r],[cx-g,cy+r],[cx-g-r,cy+r]]) + poly([[cx+g,cy-r],[cx+g+r,cy-r],[cx+g+r,cy+r],[cx+g,cy+r]]); break;

    case 'hex2trap': { const p = shapePts('hexagon',cx,cy,r); s = poly([p[3],p[4],p[5],p[0]].map(q=>[q[0],q[1]-g])) + poly([p[0],p[1],p[2],p[3]].map(q=>[q[0],q[1]+g])); } break;
    case 'tri2rt': s = poly([[cx-g,cy-r],[cx-g,cy+r*.7],[cx-g-r,cy+r*.7]]) + poly([[cx+g,cy-r],[cx+g+r,cy+r*.7],[cx+g,cy+r*.7]]); break;
    case 'circ2half': s = '<path d="M'+(cx-g)+' '+(cy-r)+' A'+r+' '+r+' 0 0 0 '+(cx-g)+' '+(cy+r)+' Z" fill="'+fill+'" stroke="var(--ink)" stroke-width="3"/>' +
                          '<path d="M'+(cx+g)+' '+(cy-r)+' A'+r+' '+r+' 0 0 1 '+(cx+g)+' '+(cy+r)+' Z" fill="'+fill+'" stroke="var(--ink)" stroke-width="3"/>'; break;

function emojiGroups(groups, e){
  // groups: [{n, x}] x = crossed-out count
  let h = '';
  groups.forEach((g,i)=>{
    if(i) h += '<span class="plus">+</span>';

    for(let k=0;k<g.n;k++) h += '<span'+(k >= g.n-(g.x||0) ? ' class="x"' : '')+'>'+e+'</span>';
    h += '</div>';
  });
  return h;
}

const dpr = ()=>Math.min(window.devicePixelRatio||1,2);
function sizeCanvas(cv,keep){

  if(snap) c.drawImage(snap,0,0,snap.width/d,snap.height/d);

}

const sky = $('sky'); let skyCtx = null, SW = 0, SH = 0; const neb = document.createElement('canvas');

function paintNebula(){
  if(!SW) return;
  const d = dpr(); neb.width = SW*d; neb.height = SH*d;
  const c = neb.getContext('2d'); c.setTransform(d,0,0,d,0,0);
  c.fillStyle = P.bg; c.fillRect(0,0,SW,SH);
  for(const b of [{x:.18,y:.12,r:.75,col:P.bg2,a:.85},{x:.86,y:.78,r:.7,col:P.accent2,a:.16},{x:.62,y:.05,r:.5,col:P.accent,a:.1}]){
    const g = c.createRadialGradient(SW*b.x,SH*b.y,0,SW*b.x,SH*b.y,Math.max(SW,SH)*b.r);
    g.addColorStop(0,b.col); g.addColorStop(1,'transparent'); c.globalAlpha = b.a; c.fillStyle = g; c.fillRect(0,0,SW,SH);
  }
  c.globalAlpha = 1;
  const v = c.createRadialGradient(SW/2,SH/2,Math.min(SW,SH)*.2,SW/2,SH/2,Math.max(SW,SH)*.75);
  v.addColorStop(0,'transparent'); v.addColorStop(1,'rgba(0,0,0,.55)'); c.fillStyle = v; c.fillRect(0,0,SW,SH);
}
function seedStars(){ stars = []; const n = Math.round(clamp((SW*SH)/9000,60,220)); for(let i=0;i<n;i++) stars.push({x:Math.random()*SW,y:Math.random()*SH,z:rand(.25,1),r:rand(.5,1.7),ph:rand(0,6.28)}); }
function resizeSky(){ const s = sizeCanvas(sky,false); skyCtx = s.ctx; SW = s.w; SH = s.h; paintNebula(); seedStars(); }
function drawSky(t,dt){
  const c = skyCtx; if(!c) return;
  c.clearRect(0,0,SW,SH); c.drawImage(neb,0,0,SW,SH);
  for(const s of stars){
    s.y -= s.z*6*dt; if(s.y < -2){ s.y = SH+2; s.x = Math.random()*SW; }
    c.globalAlpha = clamp(s.z*(R ? 1 : .55+.45*Math.sin(t*1.6+s.ph)),0,1); c.fillStyle = P.star;
    c.beginPath(); c.arc(s.x,s.y,s.r*s.z,0,6.2832); c.fill();
  }
  c.globalAlpha = 1;

    if(!shooter && Math.random() < dt*.1) shooter = {x:rand(SW*.1,SW*.9),y:rand(0,SH*.4),vx:-260,vy:170,life:1};
    if(shooter){
      shooter.x += shooter.vx*dt; shooter.y += shooter.vy*dt; shooter.life -= dt*.9;
      const g = c.createLinearGradient(shooter.x,shooter.y,shooter.x-shooter.vx*.16,shooter.y-shooter.vy*.16);

      c.beginPath(); c.moveTo(shooter.x,shooter.y); c.lineTo(shooter.x-shooter.vx*.16,shooter.y-shooter.vy*.16); c.stroke(); c.globalAlpha = 1;

const fx = $('fx'); let fxCtx = null, FW = 0, FH = 0, bits = [];
function resizeFx(){ const s = sizeCanvas(fx,false); fxCtx = s.ctx; FW = s.w; FH = s.h; }
function burst(rect,n=34){
  const cx = rect.left+rect.width/2, cy = rect.top+rect.height/2, cols = [P.accent,P.accent2,P.good,P.ink];
  for(let i=0;i<n;i++){ const a = rand(-Math.PI,0), sp = rand(140,470);
    bits.push({x:cx,y:cy,vx:Math.cos(a)*sp*rand(.5,1.4),vy:Math.sin(a)*sp,r:rand(3,8),rot:rand(0,6.28),vr:rand(-9,9),life:1,col:cols[Math.floor(Math.random()*4)],kind:Math.floor(Math.random()*3)}); }

  const c = fxCtx; if(!c) return; c.clearRect(0,0,FW,FH);

/* ============================================================
   ROUND ENGINE
   ============================================================ */
let round = null, q = null, answered = false, tries = 0, pendingBreak = false, lastStd = null;
function startRound(){
  const p = me();
  if(!p.skills.length){ show('skills'); return; }
  if(settings.theme === 'random') applyTheme();
  round = { i:0, n:settings.perRound, correct:0, second:0, stars:0, streak:0, best:0, results:{}, attempted:0 };
  pendingBreak = false; lastStd = null;
  $('round-stars').textContent = '0'; $('streak').textContent = '0';
  show('play'); nextQuestion();
}
function pickStandard(){
  const p = me(); const pool = STANDARDS.filter(s=>p.skills.includes(s.id));
  let cands = pool.length > 1 ? pool.filter(s=>s !== lastStd) : pool;
  if(!settings.adaptive) return lastStd = cands[Math.floor(Math.random()*cands.length)];
  const w = cands.map(s=>{ const st = p.stats[s.id]; const acc = st && st.n >= 3 ? st.c/st.n : .6; return .6 + 2.2*(1-acc) + (st ? 0 : .6); });
  let r = Math.random()*w.reduce((a,b)=>a+b,0);
  for(let i=0;i<cands.length;i++){ r -= w[i]; if(r <= 0) return lastStd = cands[i]; }
  return lastStd = cands[cands.length-1];
}
function paintPips(){
  const every = settings.breakEvery; const el = $('pips'); el.innerHTML = '';
  if(!every) return;
  const done = round.i % every;
  for(let i=0;i<every;i++){ const d = document.createElement('i'); if(i < done) d.className = 'on'; el.appendChild(d); }
  const s = document.createElement('span'); s.textContent = pendingBreak ? 'arcade ready' : (every-done)+' to arcade'; el.appendChild(s);
}
function paintTries(){ $('tries').innerHTML = '<i class="'+(tries>=1?'used':'')+'"></i><i class="'+(tries>=2?'used':'')+'"></i>'; }
function nextQuestion(){
  if(round.i >= round.n){ endRound(); return; }
  const std = pickStandard(); q = std.gen(); q.std = std;
  answered = false; tries = 0;
  $('prog').style.width = (100*round.i/round.n)+'%';
  $('q-skill').textContent = std.kid+' · '+std.id;
  $('speak').style.display = settings.read === 'off' ? 'none' : '';
  const pr = $('q-prompt'); pr.textContent = q.prompt; pr.className = 'prompt'+(q.story?' story':'');
  const eq = $('q-eq'); if(q.eq){ eq.innerHTML = q.eq; eq.hidden = false; } else { eq.innerHTML = ''; eq.hidden = true; }
  const st = $('q-stim'); st.innerHTML = q.stim || ''; st.className = 'stim'+(q.stimEmoji?' emoji':''); st.style.display = q.stim ? '' : 'none';
  const pad = $('pad'); pad.innerHTML = ''; pad.dataset.n = q.options.length; pad.classList.toggle('vis', !!q.vis);
  q.options.forEach((o,i)=>{
    const b = document.createElement('button'); b.className = 'opt'+(o.cls?' '+o.cls:'')+(q.vis?' vis':''); b.dataset.i = i;
    if(o.h) b.innerHTML = o.h; else b.textContent = o.t;
    b.setAttribute('aria-label', o.t ? o.t : 'choice '+(i+1));
    b.onclick = ()=>answer(i); pad.appendChild(b);
  });
  $('hint').textContent = ''; $('hint').className = 'hint';
  $('hintbox').hidden = true; $('hint-text').textContent = q.hint || '';
  $('hint-btn').style.display = q.hint ? '' : 'none';
  $('solution').hidden = true; $('sol-toggle').hidden = true; $('sol-steps').innerHTML = '';
  $('next-btn').disabled = true;
  paintPips(); paintTries();
  $('qcard').scrollTop = 0;
  if(settings.read === 'auto') setTimeout(()=>speak(q.read),150);
}
$('speak').onclick = ()=>{ if(q) speak(q.read); };
$('hint-btn').onclick = ()=>{ if(!q) return; $('hintbox').hidden = !$('hintbox').hidden; if(!$('hintbox').hidden){ SFX.tap(); if(settings.read === 'auto') speak(q.hint); } };
function showSolution(open){
  $('sol-steps').innerHTML = (q.steps||[]).map(t=>'<li><span>'+t+'</span></li>').join('');
  if(open){ $('solution').hidden = false; $('sol-toggle').hidden = true; setTimeout(()=>$('solution').scrollIntoView({behavior:R?'auto':'smooth',block:'nearest'}),60); }
  else { $('solution').hidden = true; $('sol-toggle').hidden = false; }
}
$('sol-toggle').onclick = ()=>{ $('solution').hidden = false; $('sol-toggle').hidden = true; SFX.tap(); setTimeout(()=>$('solution').scrollIntoView({behavior:R?'auto':'smooth',block:'nearest'}),30); };
function record(std, first, second){
  const p = me(); const st = p.stats[std.id] || (p.stats[std.id] = {n:0,c:0,c2:0}); st.n++; if(first) st.c++; if(second) st.c2 = (st.c2||0)+1;
  const rr = round.results[std.id] || (round.results[std.id] = {n:0,c:0}); rr.n++; if(first) rr.c++;
  round.attempted++;
}
function answerText(o){ return o.t !== undefined ? o.t : 'the picture'; }
function fillSlot(){ const slot = $('slot'); if(slot){ slot.textContent = answerText(q.options[q.answer]); slot.classList.remove('wait'); slot.classList.add('done'); } }
function answer(i){
  if(answered) return;
  const btn = $('pad').children[i], ok = i === q.answer;
  const p = me();
  tries++; paintTries();
  if(ok){
    answered = true; SFX.correct(); btn.classList.add('hit'); fillSlot();
    const first = tries === 1;
    record(q.std, first, !first);
    if(first){
      round.correct++; round.stars++; round.streak++; round.best = Math.max(round.best,round.streak);
      p.stars++; p.score += 100 + Math.min(50,(round.streak-1)*10); p.bestStreak = Math.max(p.bestStreak,round.streak);
      $('round-stars').textContent = round.stars; $('streak').textContent = round.streak;
      burst(btn.getBoundingClientRect());
      if(round.streak >= 5 && round.streak % 5 === 0){ SFX.streak(); burst($('streak-chip').getBoundingClientRect(),20); }
      $('hint').textContent = pick(['Correct!','Nice work!','You got it!','Brilliant!','Exactly right!','First try!']);
      showSolution(settings.solutions === 'always');
    } else {
      round.second++;
      $('hint').textContent = 'You got it on the second try. Here is how it works:';
      showSolution(true);
    }
    $('hint').className = 'hint good';
    if(!R) $('qcard').animate([{transform:'scale(1)'},{transform:'scale(1.02)'},{transform:'scale(1)'}],{duration:420,easing:'cubic-bezier(.34,1.56,.64,1)'});
    for(const b of $('pad').children) if(b !== btn) b.disabled = true;
    saveProfiles();
  } else {
    SFX.wrong(); btn.classList.add('miss'); btn.disabled = true;
    if(!R) $('qcard').animate([{transform:'translateX(0)'},{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'translateX(-4px)'},{transform:'translateX(0)'}],{duration:360,easing:'ease-in-out'});
    if(tries === 1){
      round.streak = 0; $('streak').textContent = '0';
      $('hint').textContent = 'Not quite. You have one more try.'; $('hint').className = 'hint bad';
      if(q.hint){ $('hintbox').hidden = false; }
      return;                                             // second attempt still open — Next stays locked
    }
    answered = true; record(q.std,false,false);
    for(const b of $('pad').children) b.disabled = true;
    const good = $('pad').children[q.answer]; good.classList.add('reveal'); good.disabled = false; good.onclick = null;
    fillSlot();
    const t = q.options[q.answer].t;
    $('hint').textContent = t !== undefined ? 'The answer was '+t+'. Here is how to find it:' : 'The right one is outlined in green. Here is why:';
    $('hint').className = 'hint bad';
    showSolution(true);
    saveProfiles();
  }
  $('next-btn').disabled = false;
}
function nextProblem(){
  if(!round || screen !== 'play') return;
  if($('next-btn').disabled) return;
  if('speechSynthesis' in window) speechSynthesis.cancel();
  round.i++;
  if(settings.breakEvery && round.i % settings.breakEvery === 0 && round.i < round.n) pendingBreak = true;
  if(pendingBreak){ pendingBreak = false; startBreak(false); return; }
  nextQuestion();
}
$('next-btn').onclick = nextProblem;

function endRound(){
  const p = me(); p.rounds++;
  if(round.attempted && round.correct === round.attempted && round.attempted >= 5){ p.perfects = (p.perfects||0)+1; }
  const won = checkBadges(p); saveProfiles();
  const acc = round.attempted ? Math.round(100*round.correct/round.attempted) : 0;
  const acc2 = round.attempted ? Math.round(100*(round.correct+round.second)/round.attempted) : 0;
  $('sum-title').textContent = acc === 100 && round.attempted ? 'Perfect round!' : acc >= 80 ? 'Great round!' : acc >= 50 ? 'Good work!' : 'Keep going!';
  const r = 62, circ = 2*Math.PI*r;
  $('ring').innerHTML = '<svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="'+r+'" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="12"/><circle cx="75" cy="75" r="'+r+'" fill="none" stroke="var(--good)" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+circ+'" stroke-dashoffset="'+(circ*(1-acc/100))+'" style="transition:stroke-dashoffset 1s ease"/></svg><div><b>'+acc+'%</b><small>'+round.correct+' of '+round.attempted+' first try'+(round.second?'<br>'+acc2+'% with second tries':'')+'</small></div>';
  $('sum-stats').innerHTML = '<span class="chip mango">★ <b>+'+round.stars+'</b></span>'+(round.second?'<span class="chip">2nd try <b>'+round.second+'</b></span>':'')+'<span class="chip fire">Best streak <b>'+round.best+'</b></span><span class="chip">Total stars <b>'+p.stars+'</b></span>';
  $('sum-skills').innerHTML = Object.entries(round.results).map(([id,r])=>{ const s = STD[id]; return '<div class="skillrow"><div class="name"><b>'+esc(s.kid)+'</b><span>'+id+'</span></div>'+meterHtml(r.n,r.c)+'</div>'; }).join('') || '<p class="muted" style="margin:0">No questions answered.</p>';
  $('sum-badges').innerHTML = won.length ? '<div style="width:100%;text-align:center" class="small muted">New badge'+(won.length>1?'s':'')+'!</div>'+badgesHtml(p, won.map(b=>b.id)) : '';
  show('summary');
  if(acc >= 80) { SFX.fanfare(); burst({left:innerWidth/2-40,top:innerHeight*.3,width:80,height:80},70); } else SFX.correct();
}
/* ============================================================
   ARCADE — six games on one dpr-aware canvas. All sizes in `u`
   (1/100 of the shorter axis) so games keep proportion anywhere.
   ============================================================ */
const mg = $('mg');
const A = { ctx:null, w:0, h:0, u:0, t:0, dt:0, over:false, score:0, key:'comet', s:{}, ot:'', os:'', free:false, run:{}, qt:0 };
const keys = {};
const best = store.get('best', { comet:0, defender:0, overdrive:0, grid:0, bubbles:0, catcher:0 });

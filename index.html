const rankOf = gems=>{ let r = RANKS[0]; for(const x of RANKS) if(gems >= x[0]) r = x; return r[1]; };
const nextRank = gems=>RANKS.find(x=>x[0] > gems);
function skinCols(){ const p = me(), sk = SKINS.find(x=>x.id===p.arcade.skin) || SKINS[0]; return {body:sk.body||P.ink, trim:sk.trim||P.accent2}; }
function questProgress(qd){ const p = me(); if(qd.cum) return p.arcade.totals[qd.stat]||0; if(qd.stat === 'score') return A.score; return A.run[qd.stat]||0; }
let toastT = null, toastQ = [];
function toast(msg){
  toastQ.push(msg); if(toastT) return;
  const next = ()=>{ if(!toastQ.length){ toastT = null; return; } const el = $('toast'); el.innerHTML = toastQ.shift(); el.classList.add('on'); toastT = setTimeout(()=>{ el.classList.remove('on'); toastT = setTimeout(next,350); },2400); };
  next();
}
function checkQuests(){
  const p = me(); let won = false;
  for(const qd of QUESTS){
    if(qd.g !== A.key || p.arcade.done.includes(qd.id)) continue;
    if(questProgress(qd) >= qd.need){
      p.arcade.done.push(qd.id); const before = rankOf(p.arcade.gems); p.arcade.gems += qd.gems; won = true;
      toast('🏅 Quest complete: '+qd.name+' &nbsp;<b style="color:var(--accent)">+'+qd.gems+' 💎</b>');
      if(rankOf(p.arcade.gems) !== before) toast('⭐ Rank up! You are now a <b>'+rankOf(p.arcade.gems)+'</b>');
    }
  }
  if(won){ SFX.fanfare(); saveProfiles(); }
  renderQuests(); renderArcadeHead();
}
function renderArcadeHead(){ const p = me(); $('mg-rank').textContent = rankOf(p.arcade.gems); $('mg-gems').textContent = p.arcade.gems; }
function questCard(qd){
  const p = me(), done = p.arcade.done.includes(qd.id), prog = done ? qd.need : Math.min(qd.need, questProgress(qd));
  return '<div class="quest '+(done?'done':'')+'"><div class="qt"><b>'+qd.name+'</b><span>'+(done?'✓ done':prog+' / '+qd.need+' · '+qd.gems+' 💎')+'</span></div><div class="qb"><i style="width:'+Math.round(100*prog/qd.need)+'%"></i></div></div>';
}
function renderQuests(){ $('mg-quests').innerHTML = QUESTS.filter(q=>q.g===A.key).map(questCard).join(''); }
function renderHangar(){
  const p = me();
  $('hangar').innerHTML = SKINS.map(sk=>{
    const owned = p.arcade.owned.includes(sk.id), on = p.arcade.skin === sk.id;
    const body = sk.body||P.ink, trim = sk.trim||P.accent2;
    const btn = on ? '<button disabled>In use</button>' : owned ? '<button data-use="'+sk.id+'">Use</button>' : '<button class="buy" data-buy="'+sk.id+'" '+(p.arcade.gems<sk.cost?'disabled':'')+'>Unlock · '+sk.cost+' 💎</button>';
    return '<div class="skin '+(on?'on':'')+'"><div class="sw" style="background:'+body+';--trim:'+trim+'"></div><div class="nm"><b>'+sk.name+'</b><span>'+(sk.cost?(owned?'Unlocked':sk.cost+' gems'):'Starter ship')+'</span></div>'+btn+'</div>';
  }).join('');
  $('hangar').querySelectorAll('[data-use]').forEach(b=>b.onclick = ()=>{ p.arcade.skin = b.dataset.use; saveProfiles(); SFX.tap(); renderHangar(); });
  $('hangar').querySelectorAll('[data-buy]').forEach(b=>b.onclick = ()=>{ const sk = SKINS.find(x=>x.id===b.dataset.buy); if(p.arcade.gems < sk.cost) return; p.arcade.gems -= sk.cost; p.arcade.owned.push(sk.id); p.arcade.skin = sk.id; saveProfiles(); SFX.fanfare(); toast('🚀 Unlocked the <b>'+sk.name+'</b> ship!'); renderHangar(); renderPickerHead(); });
}
function renderPickerHead(){ const p = me(); const nr = nextRank(p.arcade.gems); $('pk-rank').textContent = rankOf(p.arcade.gems)+(nr?' · '+(nr[0]-p.arcade.gems)+' 💎 to '+nr[1]:''); $('pk-gems').textContent = p.arcade.gems; }
function renderQuestList(){ $('questlist').innerHTML = Object.keys(INFO).map(k=>'<div style="grid-column:1/-1;font-weight:800;padding-top:6px">'+INFO[k].icon+' '+INFO[k].name+'</div>'+QUESTS.filter(q=>q.g===k).map(questCard).join('')).join(''); }

function resizeMg(){ const s = sizeCanvas(mg,false); A.ctx = s.ctx; A.w = s.w; A.h = s.h; A.u = Math.min(s.w,s.h)/100; }

/* ---------------- shared drawing ---------------- */
function wash(){ const c = A.ctx, g = c.createLinearGradient(0,0,0,A.h); g.addColorStop(0,P.bg); g.addColorStop(1,'#04030f'); c.fillStyle = g; c.fillRect(0,0,A.w,A.h); }
function hud(txt,sub){
  const c = A.ctx, u = A.u;
  c.font = '700 '+(u*5.4)+'px "Space Grotesk", monospace'; c.textAlign = 'left'; c.textBaseline = 'top';
  c.fillStyle = P.ink; c.globalAlpha = .9; c.fillText(txt,u*4,u*4);
  if(sub){ c.font = '500 '+(u*3.6)+'px "Baloo 2", sans-serif'; c.globalAlpha = .55; c.fillText(sub,u*4,u*10.5); }
  c.globalAlpha = 1;
}
function hearts(n){
  const c = A.ctx, u = A.u;
  for(let i=0;i<3;i++){ c.font = (u*5)+'px sans-serif'; c.textAlign = 'right'; c.textBaseline = 'top'; c.globalAlpha = i < n ? 1 : .2; c.fillStyle = P.accent2;
    const x = A.w-u*4-i*u*6.5, y = u*4;
    c.beginPath(); c.moveTo(x,y+u*4.5); c.bezierCurveTo(x-u*5,y+u*1.5,x-u*2.5,y-u*1.5,x,y+u*1); c.bezierCurveTo(x+u*2.5,y-u*1.5,x+u*5,y+u*1.5,x,y+u*4.5); c.fill(); }
  c.globalAlpha = 1;
}
function drawOver(){
  const c = A.ctx, u = A.u;
  c.fillStyle = 'rgba(4,3,14,.74)'; c.fillRect(0,0,A.w,A.h);
  const pw = Math.min(A.w*.82,u*78), ph = u*40, px = (A.w-pw)/2, py = (A.h-ph)/2;
  c.fillStyle = 'rgba(255,255,255,.07)'; c.strokeStyle = 'rgba(255,255,255,.16)'; c.lineWidth = 1; roundRect(c,px,py,pw,ph,u*6); c.fill(); c.stroke();
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillStyle = P.accent; c.font = '800 '+(u*8)+'px "Baloo 2", sans-serif'; c.fillText(A.ot,A.w/2,py+ph*.34);
  c.fillStyle = P.ink; c.globalAlpha = .8; c.font = '500 '+(u*4.4)+'px "Baloo 2", sans-serif'; c.fillText(A.os,A.w/2,py+ph*.6);
  c.globalAlpha = .5; c.font = '500 '+(u*3.8)+'px "Baloo 2", sans-serif'; c.fillText('Tap to play again',A.w/2,py+ph*.8); c.globalAlpha = 1;
}
function endGame(title){
  if(A.over) return;
  A.over = true; best[A.key] = Math.max(best[A.key]||0,A.score); store.set('best',best);
  A.ot = title; A.os = 'Score '+A.score+'   ·   Best '+best[A.key];
  $('mg-best').textContent = 'Best: '+best[A.key];
  checkQuests();
}
function parts(s){ return s.parts || (s.parts = []); }
function stepParts(s,drag=.9){
  const c = A.ctx, list = parts(s), dt = A.dt;
  for(let i=list.length-1;i>=0;i--){ const p = list[i]; p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= drag; p.vy *= drag; p.life -= dt*p.fade;
    if(p.life <= 0){ list.splice(i,1); continue; } c.globalAlpha = clamp(p.life,0,1); c.fillStyle = p.col; c.beginPath(); c.arc(p.x,p.y,p.r*p.life,0,6.2832); c.fill(); }
  c.globalAlpha = 1;
}
function spark(s,x,y,col,n,spread){ const list = parts(s); for(let i=0;i<n;i++){ const a = rand(0,6.2832), sp = rand(spread*.3,spread); list.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:rand(A.u*.7,A.u*2),life:1,fade:rand(1.4,2.6),col}); } }

/* ---------------- 1. Comet Rider ---------------- */
const Comet = {
  init(){ A.s = {y:A.h/2,v:0,gates:[],next:A.w*.65,started:false,parts:[],stars:[]}; for(let i=0;i<26;i++) A.s.stars.push({x:Math.random()*A.w,y:Math.random()*A.h,z:rand(.3,1)}); },
  press(){ const s = A.s; if(!s.started){ s.started = true; s.v = 0; } s.v = -.78*A.h; SFX.thrust(); spark(s,A.w*.26-A.u*3,s.y+A.u*1.5,P.accent,4,A.u*22); },
  update(dt){
    const s = A.s, u = A.u;
    if(!s.started){ s.y = A.h/2+(R?0:Math.sin(A.t*2.2)*u*1.6); return; }
    s.v += 2.45*A.h*dt; s.y += s.v*dt;
    const sp = (.42+Math.min(.2,A.score*.012))*A.w; s.next -= sp*dt;
    if(s.next <= 0){ s.next = A.w*.62; const gap = Math.max(u*24,(.34-Math.min(.09,A.score*.006))*A.h); const cy = rand(gap/2+A.h*.09,A.h-gap/2-A.h*.09); s.gates.push({x:A.w+u*7,cy,gap,scored:false}); }
    const rx = A.w*.26, rr = u*3.4, gw = u*8;
    for(let i=s.gates.length-1;i>=0;i--){ const g = s.gates[i]; g.x -= sp*dt;
      if(!g.scored && g.x+gw < rx-rr){ g.scored = true; A.score++; SFX.gate(); }
      if(g.x+gw < -u*4) s.gates.splice(i,1);
      if(rx+rr > g.x && rx-rr < g.x+gw && (s.y-rr < g.cy-g.gap/2 || s.y+rr > g.cy+g.gap/2)){ SFX.boom(); endGame('Crashed!'); } }
    if(s.y > A.h-rr || s.y < rr){ SFX.boom(); endGame('Crashed!'); }
    for(const st of s.stars){ st.x -= sp*.35*st.z*dt; if(st.x < 0){ st.x = A.w; st.y = Math.random()*A.h; } }
  },
  draw(){
    const c = A.ctx, u = A.u, s = A.s; wash();
    c.fillStyle = P.star; for(const st of s.stars){ c.globalAlpha = st.z*.6; c.beginPath(); c.arc(st.x,st.y,st.z*1.6,0,6.2832); c.fill(); } c.globalAlpha = 1;
    const gw = u*8;
    for(const g of s.gates){ const grad = c.createLinearGradient(g.x,0,g.x+gw,0); grad.addColorStop(0,P.accent2); grad.addColorStop(1,'rgba(0,0,0,.35)'); c.fillStyle = grad;
      roundRect(c,g.x,-u*4,gw,g.cy-g.gap/2+u*4,u*3); c.fill(); roundRect(c,g.x,g.cy+g.gap/2,gw,A.h-(g.cy+g.gap/2)+u*4,u*3); c.fill();
      c.fillStyle = P.ink; c.globalAlpha = .35; roundRect(c,g.x+u*.8,g.cy-g.gap/2-u*1.6,gw-u*1.6,u*1.2,u*.6); c.fill(); roundRect(c,g.x+u*.8,g.cy+g.gap/2+u*.4,gw-u*1.6,u*1.2,u*.6); c.fill(); c.globalAlpha = 1; }
    stepParts(s,.86);
    const rx = A.w*.26, tilt = clamp(s.v/(A.h*1.1),-.5,.7);
    c.save(); c.translate(rx,s.y); c.rotate(tilt);
    if(s.started && s.v < 0){ const fl = u*rand(4,7); const fg = c.createLinearGradient(-u*3,0,-u*3-fl,0); fg.addColorStop(0,P.accent); fg.addColorStop(1,'transparent'); c.fillStyle = fg; c.beginPath(); c.moveTo(-u*3,-u*1.6); c.lineTo(-u*3-fl,0); c.lineTo(-u*3,u*1.6); c.closePath(); c.fill(); }
    const sk = skinCols();
    c.fillStyle = sk.body; c.beginPath(); c.moveTo(u*5,0); c.quadraticCurveTo(u*1.5,-u*3.1,-u*3,-u*2.2); c.lineTo(-u*3,u*2.2); c.quadraticCurveTo(u*1.5,u*3.1,u*5,0); c.closePath(); c.fill();
    c.fillStyle = sk.trim; c.beginPath(); c.moveTo(-u*1,-u*2); c.lineTo(-u*4.4,-u*4.4); c.lineTo(-u*2.6,-u*1.6); c.closePath(); c.fill(); c.beginPath(); c.moveTo(-u*1,u*2); c.lineTo(-u*4.4,u*4.4); c.lineTo(-u*2.6,u*1.6); c.closePath(); c.fill();
    c.fillStyle = P.bg2; c.beginPath(); c.arc(u*1.4,0,u*1.25,0,6.2832); c.fill(); c.restore();
    hud('Gates '+A.score, s.started ? '' : 'Tap or press Space to launch');
  }
};

/* ---------------- 2. Star Defender ---------------- */
const Defender = {
  init(){ A.s = {x:A.w/2,tx:A.w/2,bolts:[],rocks:[],parts:[],cd:0,spawn:.6}; },
  press(_,x){ A.s.tx = x; }, move(_,x){ A.s.tx = x; },
  update(dt){
    const s = A.s, u = A.u;
    if(keys.ArrowLeft) s.tx -= A.w*.9*dt; if(keys.ArrowRight) s.tx += A.w*.9*dt;
    s.tx = clamp(s.tx,u*7,A.w-u*7); s.x += (s.tx-s.x)*Math.min(1,dt*13);
    s.cd -= dt; if(s.cd <= 0){ s.cd = .23; s.bolts.push({x:s.x-u*3.2,y:A.h-u*13},{x:s.x+u*3.2,y:A.h-u*13}); SFX.zap(); }
    for(let i=s.bolts.length-1;i>=0;i--){ const b = s.bolts[i]; b.y -= 1.15*A.h*dt; if(b.y < -u*4) s.bolts.splice(i,1); }
    s.spawn -= dt;
    if(s.spawn <= 0){ s.spawn = Math.max(.42,1.05-A.score*.012); const r = u*rand(4.2,7); const pts = []; for(let i=0;i<9;i++) pts.push(rand(.75,1.15));
      s.rocks.push({x:rand(r+u*3,A.w-r-u*3),y:-r-u*2,r,pts,rot:rand(0,6.28),vr:rand(-1.2,1.2),vy:(.17+Math.min(.16,A.score*.004))*A.h,hp:r>u*5.6?3:2}); }
    for(let i=s.rocks.length-1;i>=0;i--){ const k = s.rocks[i]; k.y += k.vy*dt; k.rot += k.vr*dt;
      for(let j=s.bolts.length-1;j>=0;j--){ const b = s.bolts[j];
        if(Math.abs(b.x-k.x) < k.r && Math.abs(b.y-k.y) < k.r){ s.bolts.splice(j,1); k.hp--; spark(s,b.x,k.y+k.r*.4,P.ink,5,u*30);
          if(k.hp <= 0){ spark(s,k.x,k.y,P.accent2,16,u*55); s.rocks.splice(i,1); A.score += 10; A.run.kills++; SFX.boom(); break; } } }
      if(s.rocks[i] === k){ if(k.y-k.r > A.h+u*4) s.rocks.splice(i,1); else if(k.y+k.r > A.h-u*13 && Math.abs(k.x-s.x) < k.r+u*5){ spark(s,s.x,A.h-u*10,P.accent,22,u*60); SFX.boom(); endGame('Ship down!'); } } }
  },
  draw(){
    const c = A.ctx, u = A.u, s = A.s; wash();
    c.strokeStyle = P.accent; c.lineWidth = u*.9; c.lineCap = 'round'; c.shadowBlur = u*2.5; c.shadowColor = P.accent;
    for(const b of s.bolts){ c.beginPath(); c.moveTo(b.x,b.y); c.lineTo(b.x,b.y+u*4.5); c.stroke(); } c.shadowBlur = 0;
    for(const k of s.rocks){ c.save(); c.translate(k.x,k.y); c.rotate(k.rot); c.beginPath();
      k.pts.forEach((p,i)=>{ const a = i/k.pts.length*6.2832, X = Math.cos(a)*k.r*p, Y = Math.sin(a)*k.r*p; i ? c.lineTo(X,Y) : c.moveTo(X,Y); }); c.closePath();
      const g = c.createLinearGradient(-k.r,-k.r,k.r,k.r); g.addColorStop(0,P.dim); g.addColorStop(1,P.bg2); c.fillStyle = g; c.fill(); c.strokeStyle = 'rgba(255,255,255,.28)'; c.lineWidth = u*.5; c.stroke();
      if(k.hp <= 1){ c.strokeStyle = P.accent2; c.lineWidth = u*.7; c.beginPath(); c.moveTo(-k.r*.4,-k.r*.3); c.lineTo(0,k.r*.1); c.lineTo(k.r*.35,-k.r*.4); c.stroke(); } c.restore(); }
    stepParts(s,.9);
    c.save(); c.translate(s.x,A.h-u*9);
    const eg = c.createRadialGradient(0,u*3,0,0,u*3,u*5); eg.addColorStop(0,P.accent); eg.addColorStop(1,'transparent'); c.fillStyle = eg; c.beginPath(); c.arc(0,u*3,u*5,0,6.2832); c.fill();
    const sk = skinCols();
    c.fillStyle = sk.body; c.beginPath(); c.moveTo(0,-u*6); c.quadraticCurveTo(u*2,-u*1,u*6,u*2.6); c.lineTo(u*2,u*2.6); c.lineTo(0,u*1.2); c.lineTo(-u*2,u*2.6); c.lineTo(-u*6,u*2.6); c.quadraticCurveTo(-u*2,-u*1,0,-u*6); c.closePath(); c.fill();
    c.fillStyle = sk.trim; roundRect(c,-u*1.3,-u*3.4,u*2.6,u*4,u*1.2); c.fill(); c.restore();
    hud('Points '+A.score,'Slide to steer · cannons fire for you');
  }
};

/* ---------------- 3. Overdrive ---------------- */
const Overdrive = {
  init(){ A.s = {x:A.w/2,tx:A.w/2,cars:[],dash:0,spawn:.5,lastLane:-1,parts:[]}; },
  press(_,x){ A.s.tx = x; }, move(_,x){ A.s.tx = x; },
  road(){ const w = Math.min(A.w*.78,A.u*74); return {x0:(A.w-w)/2,w}; },
  laneX(i){ const {x0,w} = Overdrive.road(); return x0+w*(i+.5)/3; },
  update(dt){
    const s = A.s, u = A.u, {x0,w} = Overdrive.road();
    const spd = Math.min(1.2*A.h,(.55+A.score*.014)*A.h); s.dash += spd*dt;
    if(keys.ArrowLeft) s.tx -= A.w*.95*dt; if(keys.ArrowRight) s.tx += A.w*.95*dt;
    s.tx = clamp(s.tx,x0+u*5.5,x0+w-u*5.5); s.x += (s.tx-s.x)*Math.min(1,dt*11);
    s.spawn -= dt;
    if(s.spawn <= 0){ s.spawn = Math.max(.42,.95-A.score*.02); let lane; do { lane = Math.floor(Math.random()*3); } while(lane === s.lastLane && Math.random() < .7); s.lastLane = lane; s.cars.push({lane,y:-u*18,hue:Math.random()<.5?P.accent2:P.good}); }
    for(let i=s.cars.length-1;i>=0;i--){ const k = s.cars[i]; k.y += spd*dt; const kx = Overdrive.laneX(k.lane);
      if(k.y > A.h-u*20 && k.y < A.h-u*4 && Math.abs(kx-s.x) < u*9){ spark(s,s.x,A.h-u*13,P.accent,24,u*62); SFX.boom(); endGame('Wipeout!'); }
      if(k.y > A.h+u*16){ s.cars.splice(i,1); A.score++; SFX.gate(); } }
  },
  car(x,y,body,dark){
    const c = A.ctx, u = A.u;
    c.fillStyle = 'rgba(0,0,0,.35)'; roundRect(c,x-u*4.6,y-u*6.4,u*9.2,u*13.4,u*2.6); c.fill();
    c.fillStyle = body; roundRect(c,x-u*4.2,y-u*7,u*8.4,u*13.4,u*2.4); c.fill();
    c.fillStyle = dark; roundRect(c,x-u*2.9,y-u*4.6,u*5.8,u*4.2,u*1.4); c.fill(); roundRect(c,x-u*3.1,y+u*2.4,u*6.2,u*2.6,u*1); c.fill();
    c.fillStyle = 'rgba(255,255,255,.22)'; roundRect(c,x-u*3.6,y-u*7,u*1.1,u*13.4,u*.6); c.fill();
  },
  draw(){
    const c = A.ctx, u = A.u, s = A.s, {x0,w} = Overdrive.road(); wash();
    const vg = c.createLinearGradient(x0-u*6,0,x0+w+u*6,0); vg.addColorStop(0,'transparent'); vg.addColorStop(.5,'rgba(255,255,255,.05)'); vg.addColorStop(1,'transparent'); c.fillStyle = vg; c.fillRect(x0-u*6,0,w+u*12,A.h);
    c.fillStyle = 'rgba(0,0,0,.45)'; c.fillRect(x0,0,w,A.h);
    c.strokeStyle = P.accent; c.lineWidth = u*.8; c.beginPath(); c.moveTo(x0,0); c.lineTo(x0,A.h); c.moveTo(x0+w,0); c.lineTo(x0+w,A.h); c.stroke();
    c.strokeStyle = 'rgba(255,255,255,.4)'; c.lineWidth = u*.9; c.setLineDash([u*7,u*6]); c.lineDashOffset = -(s.dash%(u*13));
    for(const lx of [x0+w/3,x0+2*w/3]){ c.beginPath(); c.moveTo(lx,0); c.lineTo(lx,A.h); c.stroke(); } c.setLineDash([]);
    for(const k of s.cars) Overdrive.car(Overdrive.laneX(k.lane),k.y,k.hue,'rgba(0,0,0,.55)');
    const sk = skinCols(); Overdrive.car(s.x,A.h-u*13,sk.body,sk.trim); stepParts(s,.9);
    hud('Passed '+A.score,'Steer left and right');
  }
};

/* ---------------- 4. Grid Duel ---------------- */
const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function winner(b){ for(const L of LINES) if(b[L[0]] && b[L[0]]===b[L[1]] && b[L[1]]===b[L[2]]) return {p:b[L[0]],L}; return null; }
function minimax(b,p){
  const w = winner(b); if(w) return {sc:w.p===2?10:-10}; if(!b.includes(0)) return {sc:0};
  let out = null;
  for(let i=0;i<9;i++){ if(b[i]) continue; b[i] = p; const sc = minimax(b,p===1?2:1).sc; b[i] = 0; if(!out || (p===2 ? sc>out.sc : sc<out.sc)) out = {i,sc}; }
  return out;
}
const Grid = {
  init(){ A.s = {b:[0,0,0,0,0,0,0,0,0],turn:1,marks:{},line:null,lineT:0,wait:0,done:false}; },
  geo(){ const size = Math.min(A.w,A.h)*.82, ox = (A.w-size)/2, oy = (A.h-size)/2; return {size,ox,oy,cs:size/3}; },
  place(i,p){ const s = A.s; s.b[i] = p; s.marks[i] = 0; const w = winner(s.b);
    if(w){ s.line = w.L; s.done = true; s.lineT = 0; if(w.p===1){ A.score = 1; const pr = me(); pr.arcade.totals.wins = (pr.arcade.totals.wins||0)+1; if(s.b.filter(x=>x===1).length <= 3) A.run.fastwin = 1; saveProfiles(); SFX.fanfare(); } else SFX.wrong(); } else if(!s.b.includes(0)){ s.done = true; SFX.tap(); } },
  press(_,x,y){
    const s = A.s; if(s.done || s.turn !== 1 || s.wait > 0) return;
    const {size,ox,oy,cs} = Grid.geo(); if(x<ox||x>ox+size||y<oy||y>oy+size) return;
    const i = Math.floor((y-oy)/cs)*3+Math.floor((x-ox)/cs); if(s.b[i]) return;
    SFX.zap(); Grid.place(i,1); if(!s.done){ s.turn = 2; s.wait = .45; }
  },
  update(dt){
    const s = A.s; for(const k in s.marks) s.marks[k] = Math.min(1,s.marks[k]+dt*4.5); if(s.line) s.lineT = Math.min(1,s.lineT+dt*3);
    if(s.wait > 0){ s.wait -= dt; if(s.wait <= 0 && s.turn === 2 && !s.done){ const free = s.b.map((v,i)=>v?-1:i).filter(i=>i>=0);
      const mv = Math.random() < .25 ? free[Math.floor(Math.random()*free.length)] : minimax(s.b.slice(),2).i; SFX.tap(); Grid.place(mv,2); s.turn = 1; } }
  },
  draw(){
    const c = A.ctx, u = A.u, s = A.s; wash(); const {size,ox,oy,cs} = Grid.geo();
    c.fillStyle = 'rgba(255,255,255,.04)'; c.strokeStyle = 'rgba(255,255,255,.12)'; c.lineWidth = 1; roundRect(c,ox-u*2,oy-u*2,size+u*4,size+u*4,u*6); c.fill(); c.stroke();
    c.strokeStyle = 'rgba(255,255,255,.16)'; c.lineWidth = u*.8; c.lineCap = 'round';
    for(let i=1;i<3;i++){ c.beginPath(); c.moveTo(ox+cs*i,oy+u*2); c.lineTo(ox+cs*i,oy+size-u*2); c.stroke(); c.beginPath(); c.moveTo(ox+u*2,oy+cs*i); c.lineTo(ox+size-u*2,oy+cs*i); c.stroke(); }
    for(let i=0;i<9;i++){ if(!s.b[i]) continue; const t = s.marks[i] ?? 1, cx = ox+(i%3)*cs+cs/2, cy = oy+Math.floor(i/3)*cs+cs/2, r = cs*.27; c.lineWidth = u*2.2; c.lineCap = 'round';
      if(s.b[i]===1){ c.strokeStyle = P.accent; const a = Math.min(1,t*2), b2 = Math.max(0,t*2-1); c.beginPath(); c.moveTo(cx-r,cy-r); c.lineTo(cx-r+2*r*a,cy-r+2*r*a); c.stroke(); if(b2>0){ c.beginPath(); c.moveTo(cx+r,cy-r); c.lineTo(cx+r-2*r*b2,cy-r+2*r*b2); c.stroke(); } }
      else { c.strokeStyle = P.accent2; c.beginPath(); c.arc(cx,cy,r,-1.5708,-1.5708+6.2832*t); c.stroke(); } }
    if(s.line && s.lineT > 0){ const p0 = s.line[0], p2 = s.line[2]; const x1 = ox+(p0%3)*cs+cs/2, y1 = oy+Math.floor(p0/3)*cs+cs/2, x2 = ox+(p2%3)*cs+cs/2, y2 = oy+Math.floor(p2/3)*cs+cs/2;
      c.strokeStyle = s.b[p0]===1 ? P.good : P.accent2; c.lineWidth = u*1.6; c.shadowBlur = u*3; c.shadowColor = c.strokeStyle; c.beginPath(); c.moveTo(x1,y1); c.lineTo(x1+(x2-x1)*s.lineT,y1+(y2-y1)*s.lineT); c.stroke(); c.shadowBlur = 0; }
    if(!A.over && s.done && (!s.line || s.lineT >= .95)){ const w = winner(s.b); endGame(!w ? 'A draw' : w.p===1 ? 'You win!' : 'Computer wins'); }
    hud(s.done ? '' : (s.turn===1 ? 'Your turn' : 'Thinking…'),'Three in a row wins');
  }
};

/* ---------------- 5. Bubble Blitz ---------------- */
const Bubbles = {
  init(){ A.s = {bubbles:[],spawn:.3,lives:3,parts:[]}; },
  press(_,x,y){
    const s = A.s, u = A.u;
    for(let i=s.bubbles.length-1;i>=0;i--){ const b = s.bubbles[i]; if(Math.hypot(b.x-x,b.y-y) < b.r+u*1.8){ s.bubbles.splice(i,1); A.score += b.gold ? 5 : 1; A.run.pops++; if(b.gold) A.run.gold++; SFX.pop(); spark(s,b.x,b.y,b.gold?P.accent:P.star,b.gold?18:9,u*45); return; } }
  },
  update(dt){
    const s = A.s, u = A.u;
    s.spawn -= dt;
    if(s.spawn <= 0){ s.spawn = Math.max(.32,.85-A.score*.008); s.bubbles.push({x:rand(u*9,A.w-u*9),y:A.h+u*8,r:u*rand(4.5,8.5),vy:-(.13+Math.min(.22,A.score*.003))*A.h,wob:rand(0,6.28),gold:Math.random()<.12}); }
    for(let i=s.bubbles.length-1;i>=0;i--){ const b = s.bubbles[i]; b.y += b.vy*dt; b.x += Math.sin(A.t*2+b.wob)*u*.5;
      if(b.y+b.r < 0){ s.bubbles.splice(i,1); s.lives--; SFX.wrong(); if(s.lives <= 0) endGame('Bubbles got away!'); } }
  },
  draw(){
    const c = A.ctx, u = A.u, s = A.s; wash();
    for(const b of s.bubbles){
      const g = c.createRadialGradient(b.x-b.r*.35,b.y-b.r*.35,b.r*.1,b.x,b.y,b.r);
      if(b.gold){ g.addColorStop(0,'#fff6d5'); g.addColorStop(.6,P.accent); g.addColorStop(1,'rgba(255,176,32,.35)'); } else { g.addColorStop(0,'rgba(255,255,255,.55)'); g.addColorStop(.7,'rgba(120,200,255,.28)'); g.addColorStop(1,'rgba(120,200,255,.55)'); }
      c.fillStyle = g; c.beginPath(); c.arc(b.x,b.y,b.r,0,6.2832); c.fill();
      c.strokeStyle = b.gold ? P.accent : 'rgba(255,255,255,.6)'; c.lineWidth = u*.5; c.stroke();
      c.fillStyle = 'rgba(255,255,255,.7)'; c.beginPath(); c.ellipse(b.x-b.r*.4,b.y-b.r*.45,b.r*.22,b.r*.12,-.7,0,6.2832); c.fill();
    }
    stepParts(s,.88); hud('Popped '+A.score,'Tap the bubbles'); hearts(s.lives);
  }
};

/* ---------------- 6. Star Catcher ---------------- */
const Catcher = {
  init(){ A.s = {x:A.w/2,tx:A.w/2,items:[],spawn:.4,lives:3,parts:[],wob:0}; },
  press(_,x){ A.s.tx = x; }, move(_,x){ A.s.tx = x; },
  update(dt){
    const s = A.s, u = A.u;
    if(keys.ArrowLeft) s.tx -= A.w*.9*dt; if(keys.ArrowRight) s.tx += A.w*.9*dt;
    s.tx = clamp(s.tx,u*9,A.w-u*9); s.x += (s.tx-s.x)*Math.min(1,dt*12);
    s.spawn -= dt;
    if(s.spawn <= 0){ s.spawn = Math.max(.35,.9-A.score*.012); s.items.push({x:rand(u*6,A.w-u*6),y:-u*6,rock:Math.random()<.18,vy:(.24+Math.min(.28,A.score*.006))*A.h,rot:rand(0,6.28),vr:rand(-3,3)}); }
    const by = A.h-u*12, bw = u*9;
    for(let i=s.items.length-1;i>=0;i--){ const it = s.items[i]; it.y += it.vy*dt; it.rot += it.vr*dt;
      if(it.y > by-u*2 && it.y < by+u*5 && Math.abs(it.x-s.x) < bw){ s.items.splice(i,1);
        if(it.rock){ s.lives--; s.wob = 1; A.run.cleanRun = 0; SFX.boom(); spark(s,it.x,by,P.accent2,14,u*50); if(s.lives <= 0) endGame('Basket broke!'); }
        else { A.score++; A.run.cleanRun++; A.run.clean = Math.max(A.run.clean,A.run.cleanRun); SFX.gate(); spark(s,it.x,by,P.accent,10,u*40); } continue; }
      if(it.y > A.h+u*8) s.items.splice(i,1); }
    s.wob = Math.max(0,s.wob-dt*3);
  },
  draw(){
    const c = A.ctx, u = A.u, s = A.s; wash();
    for(const it of s.items){ c.save(); c.translate(it.x,it.y); c.rotate(it.rot);
      if(it.rock){ c.fillStyle = P.dim; c.beginPath(); for(let k=0;k<7;k++){ const a = k/7*6.2832, rr = u*3.2*(k%2?.8:1.05); k ? c.lineTo(Math.cos(a)*rr,Math.sin(a)*rr) : c.moveTo(Math.cos(a)*rr,Math.sin(a)*rr); } c.closePath(); c.fill(); c.strokeStyle = 'rgba(0,0,0,.35)'; c.lineWidth = u*.5; c.stroke(); }
      else { c.shadowBlur = u*3; c.shadowColor = P.accent; c.fillStyle = P.accent; starPath(c,0,0,u*3.6,5); c.fill(); c.shadowBlur = 0; }
      c.restore(); }
    stepParts(s,.9);
    const by = A.h-u*12, bw = u*9, tilt = Math.sin(A.t*30)*s.wob*.15;
    c.save(); c.translate(s.x,by); c.rotate(tilt);
    const sk = skinCols();
    c.fillStyle = sk.trim; c.beginPath(); c.moveTo(-bw,-u*2); c.lineTo(bw,-u*2); c.lineTo(bw*.78,u*7); c.lineTo(-bw*.78,u*7); c.closePath(); c.fill();
    c.strokeStyle = 'rgba(0,0,0,.28)'; c.lineWidth = u*.6; for(let k=-2;k<=2;k++){ c.beginPath(); c.moveTo(k*bw*.38,-u*2); c.lineTo(k*bw*.3,u*7); c.stroke(); }
    c.fillStyle = sk.body; roundRect(c,-bw-u*.6,-u*3.2,bw*2+u*1.2,u*2.2,u*1); c.fill();
    c.strokeStyle = sk.body; c.lineWidth = u*.9; c.beginPath(); c.arc(0,-u*3,bw*.7,Math.PI,0); c.stroke(); c.restore();
    hud('Stars '+A.score,'Slide the basket'); hearts(s.lives);
  }
};

const GAMES = {comet:Comet, defender:Defender, overdrive:Overdrive, grid:Grid, bubbles:Bubbles, catcher:Catcher};

/* ---------------- arcade shell ---------------- */
function mgLoop(ts){
  const dt = Math.min(.033,(ts-mgLast)/1000 || 0); mgLast = ts; A.t += dt; A.dt = dt;
  const g = GAMES[A.key]; if(!A.over){ g.update(dt); A.run.time += dt; A.qt += dt; if(A.qt > .5){ A.qt = 0; checkQuests(); } } g.draw(); if(A.over) drawOver();
  mgRAF = requestAnimationFrame(mgLoop);
}
function bootGame(){
  checkQuests();
  A.over = false; A.score = 0; A.t = 0; A.run = {time:0,kills:0,pops:0,gold:0,clean:0,cleanRun:0,fastwin:0}; A.qt = 0; GAMES[A.key].init();
  const p = me(); p.arcade.totals.gamesPlayed = (p.arcade.totals.gamesPlayed||0)+1;
  renderQuests(); renderArcadeHead();
  $('mg-title').textContent = INFO[A.key].icon+' '+INFO[A.key].name; $('mg-say').textContent = INFO[A.key].say;
  $('mg-best').textContent = 'Best: '+(best[A.key]||0);
}
function startBreak(free, key){
  A.free = !!free;
  const list = Object.keys(GAMES); A.key = key || list[Math.floor(Math.random()*list.length)];
  $('arcade').classList.add('on'); skyPaused = true; setTool('tap'); wipeBoard();
  $('mg-done').textContent = free ? 'Done' : 'Back to math';
  $('mg-clock').style.display = free ? 'none' : ''; $('mg-barwrap').style.display = free ? 'none' : '';
  if(!free){ const p = me(); p.arcadeBreaks = (p.arcadeBreaks||0)+1; saveProfiles(); }
  requestAnimationFrame(()=>{ resizeMg(); bootGame(); if(!mgRAF){ mgLast = performance.now(); mgRAF = requestAnimationFrame(mgLoop); } });
  clearInterval(breakTimer);
  if(!free){ breakTotal = breakLeft = settings.breakSecs; tickClock(); breakTimer = setInterval(()=>{ breakLeft--; tickClock(); if(breakLeft <= 0) endBreak(); },1000); }
}
function tickClock(){ $('mg-clock').textContent = breakLeft+'s'; $('mg-bar').style.transform = 'scaleX('+(breakLeft/breakTotal)+')'; }
function endBreak(){
  checkQuests(); saveProfiles();
  clearInterval(breakTimer); cancelAnimationFrame(mgRAF); mgRAF = null;
  $('arcade').classList.remove('on'); skyPaused = false;
  if(A.free) show('home'); else nextQuestion();
}
$('mg-done').addEventListener('click',endBreak);
$('mg-switch').addEventListener('click',()=>openPicker(false));

/* picker */
function pickerTab(which){
  for(const [id,el] of [['tab-games','gamegrid'],['tab-hangar','hangar'],['tab-quests','questlist']]){ $(id).classList.toggle('on',id==='tab-'+which); $(el).hidden = el !== {games:'gamegrid',hangar:'hangar',quests:'questlist'}[which]; }
  $('picker-note').textContent = which==='hangar' ? 'Ship colors show up in every game.' : which==='quests' ? 'Quests count while you play. Gems unlock ships in the Hangar.' : 'Complete quests to earn gems. Spend gems in the Hangar on new ship colors.';
}
$('tab-games').onclick = ()=>pickerTab('games'); $('tab-hangar').onclick = ()=>pickerTab('hangar'); $('tab-quests').onclick = ()=>pickerTab('quests');
function openPicker(free){
  $('picker-title').textContent = free ? 'Arcade' : 'Switch game';
  $('gamegrid').innerHTML = Object.entries(INFO).map(([k,i])=>{ const done = QUESTS.filter(q=>q.g===k && me().arcade.done.includes(q.id)).length; return '<button class="gamecard" data-k="'+k+'"><i>'+i.icon+'</i><b>'+i.name+'</b><span>'+i.blurb+' · best '+(best[k]||0)+'</span><span>Quests '+done+'/3</span></button>'; }).join('');
  $('gamegrid').querySelectorAll('.gamecard').forEach(b=>b.onclick = ()=>{
    $('picker').classList.remove('on');
    if(free) startBreak(true, b.dataset.k);
    else { A.key = b.dataset.k; bootGame(); }
  });
  renderPickerHead(); renderHangar(); renderQuestList(); pickerTab('games');
  $('picker').classList.add('on');
}
$('picker-close').onclick = ()=>$('picker').classList.remove('on');

function mgPoint(e){ const r = mg.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }
mg.addEventListener('pointerdown',e=>{ e.preventDefault(); ac(); if(A.over){ bootGame(); return; } const p = mgPoint(e); GAMES[A.key].press?.(A,p.x,p.y); });
mg.addEventListener('pointermove',e=>{ if(A.over) return; const p = mgPoint(e); GAMES[A.key].move?.(A,p.x,p.y); });

/* ---------------- keyboard ---------------- */
addEventListener('keydown',e=>{
  keys[e.key] = true;
  const arcadeOpen = $('arcade').classList.contains('on'), modalOpen = document.querySelector('.modal.on');
  if(arcadeOpen){
    if(e.key === ' ' || e.key === 'ArrowUp'){ e.preventDefault(); if(A.over) bootGame(); else GAMES[A.key].press?.(A,A.w/2,A.h/2); }
    if(e.key === 'Escape') endBreak();
    return;
  }
  if(modalOpen){ if(e.key === 'Escape') modalOpen.classList.remove('on'); return; }
  if(screen === 'play'){
    if(['1','2','3','4'].includes(e.key) && q && +e.key <= q.options.length) answer(+e.key-1);
    if(e.key === 'Enter' || e.key.toLowerCase() === 'n') nextProblem();
    if(e.key === 'Escape') $('quit').click();
    if(e.key.toLowerCase() === 'r') speak(q && q.read);
  } else if(e.key === 'Escape' && screen !== 'home') show('home');
});
addEventListener('keyup',e=>{ keys[e.key] = false; });
addEventListener('pointerdown',()=>{ try{ ac(); }catch(e){} },{once:true});

/* ---------------- boot ---------------- */
function resizeAll(){ resizeSky(); resizeFx(); resizeBoard(); if($('arcade').classList.contains('on')) resizeMg(); }
let rzT = null;
addEventListener('resize',()=>{ clearTimeout(rzT); rzT = setTimeout(resizeAll,120); });
addEventListener('orientationchange',()=>setTimeout(resizeAll,260));
document.addEventListener('visibilitychange',()=>{ if(document.hidden && 'speechSynthesis' in window) speechSynthesis.cancel(); });

applyTheme();
resizeAll();
renderHome();
requestAnimationFrame(mainLoop);
</script>
</body>
